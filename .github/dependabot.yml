# Monthly update PRs for workflow actions and the hyparquet dev dependencies.
# A hyparquet bump fails `npm test` until the CDN URLs in app.js match the lockfile, by design.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      hyparquet:
        patterns: ['hyparquet*']
