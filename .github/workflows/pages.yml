name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily rebuild so the published price snapshot stays current. 09:17 in Malaysia.
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Publish only what the browser loads: the page, the root *.js modules, the app manifest and icons,
      # the product photos and the price snapshot.
      # Tests (*.mjs), tools/ and node_modules/ stay out.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html manifest.webmanifest *.js _site/
          cp -r img icons _site/
      - id: pages
        uses: actions/configure-pages@v6
      # If data.gov.my is down this fails the run, so the last good deployment, with its snapshot, stays live.
      # The live history.json supplies finished months, so only the current month is downloaded.
      - name: Build price snapshot and history
        run: node tools/snapshot.mjs _site/data
        env:
          HISTORY_URL: ${{ steps.pages.outputs.base_url }}/data/history.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
